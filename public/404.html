<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found | Chaoyun Zhang</title>
    <style>
      :root { --accent: #70c1b3; --ink: #2a7a6e; --paper: #fbfdfc; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: #1f2937;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      main { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .card { max-width: 440px; }
      .code { font-size: 14px; color: var(--ink); letter-spacing: .02em; }
      h1 { font-size: 32px; letter-spacing: -.02em; margin: 8px 0 12px; }
      p { color: #4b5563; line-height: 1.6; margin: 0 0 24px; }
      a { display: inline-block; padding: 10px 16px; border-radius: 8px; background: var(--ink); color: #f4fbf9;
        text-decoration: none; font-weight: 500; font-size: 14px; }
      a:hover { background: #134e46; }
      a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .rule { height: 2px; width: 56px; background: var(--accent); margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="rule"></div>
        <div class="code">404</div>
        <h1>This page does not exist.</h1>
        <p>The link may be old or mistyped. The homepage has everything: NorthCUA, UFO, publications and contact.</p>
        <a href="/">Back to the homepage</a>
      </div>
    </main>
  </body>
</html>
